name: Publish SonicEEG

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-soniceeg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soniceeg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Mark the published source revision
        run: node -e 'require("node:fs").writeFileSync("dist/release.json", JSON.stringify({commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()},null,2))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
