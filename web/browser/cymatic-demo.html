<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonicEEG Cymatic Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070b;color:#dcebf3;font:13px system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:2;left:18px;top:16px}.top b{letter-spacing:.12em;text-transform:uppercase}.top small{display:block;color:#7893a2;margin-top:4px}.hud{position:fixed;z-index:3;left:14px;right:14px;bottom:14px;padding:10px;border:1px solid #18303c;background:#071019d9;backdrop-filter:blur(14px);border-radius:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,select,label{font:inherit;color:#a9c0cc}button,select{background:#0d202b;border:1px solid #244554;border-radius:7px;padding:7px 9px}button.on{background:#1d536d;color:#fff}.metrics{margin-left:auto;display:flex;gap:14px;color:#77909e}.metrics b{color:#e8f7ff}.truth{position:fixed;z-index:2;top:68px;left:0;right:0;text-align:center;color:#74909f;font-size:10px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:720px){.metrics{width:100%;margin-left:0;justify-content:space-between}.top small{display:none}}</style></head><body><canvas id="c"></canvas><div class="top"><b>SonicEEG · Cymatic Lab</b><small>Signal-derived geometry; synthetic EEG demonstration</small></div><div class="truth" id="truth">Hybrid neural field · interference + scalp topology</div><div class="hud"><button data-m="constellation">Constellation</button><button data-m="cymatic">Cymatic field</button><button class="on" data-m="hybrid">Hybrid</button><select id="scenario"><option value="alpha">Eyes closed · posterior alpha</option><option value="open">Eyes open · alpha attenuation</option><option value="focal">Focal rhythmic · left temporal</option><option value="burst">Transient burst</option><option value="mixed">Mixed background</option></select><label><input id="art" type="checkbox" checked> Art layer</label><div class="metrics"><span>posterior α <b id="a">0.84</b></span><span>synchrony <b id="s">0.78</b></span><span>entropy <b id="e">0.24</b></span></div></div><script>(()=>{const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,dpr=1,t=0,last=0,mode='hybrid',scenario='alpha',art=true;const C={delta:[120,145,255],theta:[163,126,255],alpha:[102,220,255],beta:[93,255,187],gamma:[255,180,100]};const defs=[['Fp1',-.48,-.92],['Fp2',.48,-.92],['F7',-.88,-.58],['F3',-.42,-.55],['Fz',0,-.52],['F4',.42,-.55],['F8',.88,-.58],['T3',-.98,-.1],['C3',-.46,-.08],['Cz',0,-.04],['C4',.46,-.08],['T4',.98,-.1],['T5',-.86,.48],['P3',-.4,.49],['Pz',0,.5],['P4',.4,.49],['T6',.86,.48],['O1',-.36,.91],['O2',.36,.91]];const ch=defs.map(([n,px,py],i)=>({n,px,py,i,amp:.2,f:9,ph:i*.37,h:[]}));const links=[];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++){let a=ch[i],b=ch[j],d=Math.hypot(a.px-b.px,a.py-b.py),m=Math.abs(a.px+b.px)<.12&&Math.abs(a.py-b.py)<.16;if(d<.55||m)links.push([i,j,m])}const pts=Array.from({length:3200},(_,i)=>{let q=(i*.61803398875%1)*Math.PI*2,r=Math.sqrt(i*.754877666%1)*.97;return{px:Math.cos(q)*r,py:Math.sin(q)*r,r,q}});const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#03070b';x.fillRect(0,0,W,H)}addEventListener('resize',resize);resize();function col(f){return f<4?C.delta:f<8?C.theta:f<13?C.alpha:f<30?C.beta:C.gamma}function state(){let A=.84,S=.78,E=.24;if(scenario==='open'){A=.24;S=.35;E=.61}if(scenario==='focal'){A=.36;S=.57;E=.44}if(scenario==='burst'){A=.42;S=.46;E=.54}if(scenario==='mixed'){A=.44;S=.3;E=.73}let burst=scenario==='burst'?Math.exp(-(((t%4.8)-2.1)/.34)**2):0;ch.forEach((c,i)=>{let post=clamp((c.py+.15)/1.2),lt=clamp(1-Math.hypot(c.px+.86,c.py-.05)/.85),f=9.6+Math.sin(i*1.7)*.5,amp=.18+.15*A*post,spread=(1-S)*1.9;if(scenario==='open'){f=17+5*Math.sin(i*2.2+t*.3);amp=.16+.06*Math.sin(t*2+i)**2;spread=2.7}if(scenario==='focal'){f=6.3+lt*.5;amp=.16+lt*.72+.08*post;spread=1.4}if(scenario==='burst'){f=8.5+burst*5.5;amp=.18+.16*post+burst*(.65-.18*Math.abs(c.px));spread=1.5-burst*.9}if(scenario==='mixed'){f=5+(i*7)%25+3*Math.sin(t*.23+i);amp=.12+.18*(.5+.5*Math.sin(t*1.1+i*1.9));spread=3.2}c.f+=.08*(f-c.f);c.amp+=.09*(clamp(amp)-c.amp);c.ph=t*c.f*Math.PI*2+Math.sin(i*12.77)*spread+Math.sin(t*.9+i)*E*.45});return{A:clamp(A+Math.sin(t*.4)*.035),S:clamp(S+Math.sin(t*.27)*.04),E:clamp(E+Math.sin(t*.31+2)*.04)}}function p(c){let R=Math.min(W,H)*.29;return[W*.5+c.px*R,H*.46+c.py*R]}function sync(a,b,S){let d=Math.abs(Math.atan2(Math.sin(a.ph-b.ph),Math.cos(a.ph-b.ph)));return Math.exp(-d*d/(.45+.9*(1-S)))*Math.exp(-Math.abs(a.f-b.f)/4.4)}function background(){x.globalCompositeOperation='source-over';x.fillStyle=art?'rgba(3,7,11,.15)':'rgba(3,7,11,.5)';x.fillRect(0,0,W,H)}function constellation(st,op=1){x.save();x.globalCompositeOperation=art?'lighter':'source-over';for(const [ia,ib,m] of links){let a=ch[ia],b=ch[ib],q=sync(a,b,st.S);if(q<.31)continue;let A=p(a),B=p(b);x.strokeStyle=`rgba(${m?'145,205,244':'88,151,186'},${clamp((q-.28)*.34*(m?1.2:1)*op,0,.35)})`;x.lineWidth=.55+q*.7;x.beginPath();x.moveTo(...A);x.lineTo(...B);x.stroke()}ch.forEach(c=>{let [px,py]=p(c),cc=col(c.f),r=2+c.amp*8;c.h.push([px,py]);if(c.h.length>18)c.h.shift();if(art&&c.h.length>2){x.beginPath();c.h.forEach((v,k)=>k?x.lineTo(...v):x.moveTo(...v));x.strokeStyle=`rgba(90,178,220,${.02+.03*c.amp})`;x.stroke()}if(art){let g=x.createRadialGradient(px,py,0,px,py,r*4);g.addColorStop(0,`rgba(${cc},${.4*op})`);g.addColorStop(1,`rgba(${cc},0)`);x.fillStyle=g;x.beginPath();x.arc(px,py,r*4,0,7);x.fill()}x.fillStyle=`rgba(${cc},${(.62+c.amp*.35)*op})`;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.fillStyle=`rgba(244,253,255,${.65*op})`;x.beginPath();x.arc(px,py,Math.max(.8,r*.18),0,7);x.fill();x.globalCompositeOperation='source-over';x.fillStyle=`rgba(178,207,220,${.45*op})`;x.font='10px system-ui';x.textAlign='center';x.fillText(c.n,px,py+r+12);x.globalCompositeOperation=art?'lighter':'source-over'});x.restore()}function cymatic(st,op=1){let cx=W*.5,cy=H*.46,R=Math.min(W,H)*.34;x.save();x.globalCompositeOperation=art?'lighter':'source-over';for(const q of pts){let field=0,w=0,rr=0,gg=0,bb=0;for(const s of ch){let dx=q.px-s.px*.64,dy=q.py-s.py*.64,d=Math.hypot(dx,dy),k=3.2+Math.sqrt(s.f)*1.22,att=Math.exp(-d*1.05),v=Math.cos(k*d*2.45-s.ph)*s.amp*att,cc=col(s.f);field+=v;w+=Math.abs(v);rr+=cc[0]*Math.abs(v);gg+=cc[1]*Math.abs(v);bb+=cc[2]*Math.abs(v)}let norm=Math.abs(field)/(.34+w),node=(clamp(1-Math.abs(field)*2))**4.5,anti=clamp(norm)**2.15,vis=art?Math.max(node*.82,anti*.76):anti;if(vis<.06)continue;let spin=art?.018*Math.sin(t*.55+q.r*10+q.q*5)*st.E:0,cs=Math.cos(spin),sn=Math.sin(spin),px=cx+(q.px*cs-q.py*sn)*R,py=cy+(q.px*sn+q.py*cs)*R,iv=1/(w+.001);x.fillStyle=`rgba(${rr*iv|0},${gg*iv|0},${bb*iv|0},${clamp(vis*(art?.34:.52)*op,0,.46)})`;let z=.5+(node*1.15+anti*1.7);x.fillRect(px,py,z,z)}if(art){let arms=Math.round(6+st.S*8);x.strokeStyle=`rgba(136,202,233,${.035*op})`;x.lineWidth=.7;for(let i=0;i<arms;i++){let a=i/arms*Math.PI*2+t*.025;x.beginPath();for(let j=0;j<34;j++){let r=R*j/34*.88,w=.12*Math.sin(j*.55+t*.7+i),px=cx+Math.cos(a+w)*r,py=cy+Math.sin(a+w)*r;j?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}}x.restore()}function loop(n){let dt=Math.min(.05,(n-last)/1000||.016);last=n;t+=dt;let st=state();background();if(mode==='constellation')constellation(st);else if(mode==='cymatic')cymatic(st);else{cymatic(st,.78);constellation(st,.86)}document.getElementById('a').textContent=st.A.toFixed(2);document.getElementById('s').textContent=st.S.toFixed(2);document.getElementById('e').textContent=st.E.toFixed(2);requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(q=>q.classList.toggle('on',q===b));document.getElementById('truth').textContent=mode==='constellation'?'Constellation · scalp topology + synchrony':mode==='cymatic'?'Cymatic field · summed phase interference':'Hybrid neural field · interference + scalp topology';x.fillStyle='#03070b';x.fillRect(0,0,W,H)});document.getElementById('scenario').onchange=e=>scenario=e.target.value;document.getElementById('art').onchange=e=>art=e.target.checked})();</script></body></html>
