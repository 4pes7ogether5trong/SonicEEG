name: Publish SonicEEG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soniceeg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Mark the published source revision
        run: node -e 'require("node:fs").writeFileSync("dist/release.json", JSON.stringify({commit:require("node:child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),builtAt:new Date().toISOString()},null,2))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's generated branch publisher does not emit workflow_run here.
      # Wait for its deployment, then publish the actual application last.
      - name: Wait for the existing branch publisher
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 90; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, event: 'dynamic', per_page: 10,
              });
              const legacy = data.workflow_runs.find(run => run.name === 'pages build and deployment');
              if (legacy?.status === 'completed') {
                core.info(`Existing branch publisher finished: ${legacy.conclusion}`);
                return;
              }
              if (!legacy && attempt >= 6) {
                core.info('No branch publisher was scheduled for this revision.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The existing branch publisher has not finished; withholding this deployment to avoid a race.');
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
