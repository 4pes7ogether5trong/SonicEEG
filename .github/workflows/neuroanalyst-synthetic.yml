name: Neuroanalyst synthetic regression checks
on:
  push:
    branches:
      - 'neuroanalyst/**'
    paths:
      - 'neuroanalyst/**'
      - '.github/workflows/neuroanalyst-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run metadata-only regression suite
        run: |
          set -eu
          for test in neuroanalyst/*.test.cjs; do
            echo "Running $test"
            node --test "$test"
          done
